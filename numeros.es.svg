<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 880" width="840" height="880" role="img" aria-label="Números en GitHub de Nicolás Uribe">
<title>Números en GitHub de Nicolás Uribe</title>
<defs>
<radialGradient id="fondo" cx="50%" cy="0%" r="120%">
<stop offset="0" stop-color="#161b2b"/><stop offset=".55" stop-color="#0d1017"/><stop offset="1" stop-color="#0b0d13"/>
</radialGradient>
<linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#8fb8ff"/>
</linearGradient>
<filter id="difuso" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="76"/></filter>
<clipPath id="recorte"><rect width="840" height="880" rx="24"/></clipPath>
</defs>
<style>
text{font-family:Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#f5f5f7}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace}
.tenue{fill:#8e8e93}

.cap{font-size:22px;letter-spacing:.04em}
.grande{font-size:156px;font-weight:900;letter-spacing:-.05em;opacity:0;animation:enfoca 1.1s cubic-bezier(.22,1,.36,1) forwards}
.sub{font-size:30px}
.v{font-size:58px;font-weight:800;letter-spacing:-.03em}
.u{font-size:28px;font-weight:600;fill:#8e8e93}
.et{font-size:21px}
.l{font-size:25px}
.pie{font-size:20px}
.sube{opacity:0;animation:sube .6s cubic-bezier(0.16, 1, 0.3, 1) forwards}
.barra{transform-origin:56px 605px;transform:scaleX(0);animation:crece 1s cubic-bezier(0.16, 1, 0.3, 1) .6s forwards}
@keyframes sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enfoca{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
@keyframes crece{to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}}
</style>
<g clip-path="url(#recorte)">
<rect width="840" height="880" fill="url(#fondo)"/>
<ellipse cx="655" cy="106" rx="252" ry="246" fill="#bf5af2" opacity=".14" filter="url(#difuso)"/>
<text class="tenue mono cap sube" x="56" y="96">últimos 12 meses</text>
<text class="grande" x="50" y="236">391</text>
<text class="tenue sub sube" x="56" y="286" style="animation-delay:160ms">contribuciones</text>
<g class="sube" style="animation-delay:260ms">
<rect x="56.0" y="330" width="229.3" height="150" rx="22" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".06"/>
<text class="v" x="82.0" y="408">0<tspan class="u" dx="4">d</tspan></text>
<text class="tenue et" x="82.0" y="448">racha actual</text>
</g><g class="sube" style="animation-delay:340ms">
<rect x="305.3" y="330" width="229.3" height="150" rx="22" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".06"/>
<text class="v" x="331.3" y="408">7<tspan class="u" dx="4">d</tspan></text>
<text class="tenue et" x="331.3" y="448">racha más larga</text>
</g><g class="sube" style="animation-delay:420ms">
<rect x="554.7" y="330" width="229.3" height="150" rx="22" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".06"/>
<text class="v" x="580.7" y="408">70<tspan class="u" dx="4"></tspan></text>
<text class="tenue et" x="580.7" y="448">días activos</text>
</g>
<text class="tenue mono cap sube" x="56" y="560" style="animation-delay:520ms">lenguajes</text>
<text class="tenue mono cap sube" x="784" y="560" text-anchor="end" style="animation-delay:520ms">11 repos · 9 privados</text>
<clipPath id="pildora"><rect x="56" y="596" width="728" height="18" rx="9"/></clipPath>
<rect x="56" y="596" width="728" height="18" rx="9" fill="#fff" fill-opacity=".05"/>
<g clip-path="url(#pildora)"><g class="barra"><rect x="56.0" y="596" width="633.6" height="18" fill="#0a84ff"/><rect x="689.1" y="596" width="34.0" height="18" fill="#bf5af2"/><rect x="722.5" y="596" width="22.9" height="18" fill="#40c8e0"/><rect x="745.0" y="596" width="15.8" height="18" fill="#30d158"/><rect x="760.2" y="596" width="13.5" height="18" fill="#ffd60a"/><rect x="773.2" y="596" width="11.3" height="18" fill="#48484a"/></g></g>
<g class="sube" style="animation-delay:620ms">
<circle cx="65.0" cy="663" r="8" fill="#0a84ff"/>
<text class="l" x="86.0" y="672">TypeScript</text>
<text class="l tenue" x="384.0" y="672" text-anchor="end">87,0 %</text>
</g><g class="sube" style="animation-delay:660ms">
<circle cx="429.0" cy="663" r="8" fill="#bf5af2"/>
<text class="l" x="450.0" y="672">JavaScript</text>
<text class="l tenue" x="748.0" y="672" text-anchor="end">4,6 %</text>
</g><g class="sube" style="animation-delay:700ms">
<circle cx="65.0" cy="709" r="8" fill="#40c8e0"/>
<text class="l" x="86.0" y="718">CSS</text>
<text class="l tenue" x="384.0" y="718" text-anchor="end">3,1 %</text>
</g><g class="sube" style="animation-delay:740ms">
<circle cx="429.0" cy="709" r="8" fill="#30d158"/>
<text class="l" x="450.0" y="718">PLpgSQL</text>
<text class="l tenue" x="748.0" y="718" text-anchor="end">2,1 %</text>
</g><g class="sube" style="animation-delay:780ms">
<circle cx="65.0" cy="755" r="8" fill="#ffd60a"/>
<text class="l" x="86.0" y="764">Python</text>
<text class="l tenue" x="384.0" y="764" text-anchor="end">1,8 %</text>
</g><g class="sube" style="animation-delay:820ms">
<circle cx="429.0" cy="755" r="8" fill="#48484a"/>
<text class="l" x="450.0" y="764">Otros</text>
<text class="l tenue" x="748.0" y="764" text-anchor="end">1,5 %</text>
</g>
<text class="tenue mono pie" x="56" y="836">actualizado 2026-10-26</text>
</g>
<rect x=".5" y=".5" width="839" height="879" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
